<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Arcade</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="hero" aria-labelledby="game-title">
        <p class="eyebrow">Classic arcade</p>
        <h1 id="game-title">Snake Play Game</h1>
        <p class="intro">Guide the snake, eat glowing apples, and avoid crashing into the wall or yourself.</p>
      </section>

      <section class="score-panel" aria-label="Game statistics">
        <div>
          <span>Score</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span>Best</span>
          <strong id="best-score">0</strong>
        </div>
        <div>
          <span>Status</span>
          <strong id="status">Ready</strong>
        </div>
      </section>

      <section class="board-card">
        <canvas id="game-board" width="480" height="480" aria-label="Snake game board"></canvas>
        <div class="controls">
          <button id="start-button" type="button">Start Game</button>
          <button id="pause-button" type="button">Pause</button>
          <button id="reset-button" type="button">Reset</button>
        </div>
      </section>

      <section class="help-card" aria-labelledby="how-to-play">
        <h2 id="how-to-play">How to play</h2>
        <ul>
          <li>Use arrow keys or WASD to move.</li>
          <li>On touch screens, swipe in the direction you want to go.</li>
          <li>Press Space to pause or resume.</li>
        </ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
